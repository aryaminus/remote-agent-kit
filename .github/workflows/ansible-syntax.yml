name: ansible-syntax
on: [push, pull_request]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Install ansible-core + collections
        run: |
          pip install ansible-core
          ansible-galaxy collection install -r ansible/collections/requirements.yml -p ./ansible/collections
      - name: Playbook syntax check
        run: ansible-playbook -i ansible/inventory/hosts.yml.example --syntax-check ansible/playbook.yml
        # NOTE: hosts.yml.example holds a CHANGEME host — syntax check parses
        # structure only and never connects, so this is safe.
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - run: shellcheck -S warning scripts/*.sh
