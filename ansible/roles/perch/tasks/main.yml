# perch — make the phone client work over the tailnet.
# 1. Dashboard on 9119 (tailnet-only) as a user systemd service, with a PINNED
#    session token (unpinned tokens regenerate every restart and silently unpair).
# 2. perch-approvals hook plugin so approvals reach ntfy (P1.19 bridge).
- name: Generate dashboard basic-auth password when not provided
  ansible.builtin.set_fact:
    dash_user: "{{ lookup('env', 'HERMES_DASHBOARD_BASIC_AUTH_USERNAME') | default('admin', true) }}"
    dash_pass: "{{ lookup('env', 'HERMES_DASHBOARD_BASIC_AUTH_PASSWORD') | default(lookup('password', '/dev/null length=32 chars=ascii_letters,digits'), true) }}"
    dash_secret: "{{ lookup('env', 'HERMES_DASHBOARD_BASIC_AUTH_SECRET') | default(lookup('password', '/dev/null length=43 chars=ascii_letters,digits'), true) }}"
  no_log: true

- name: Write dashboard basic-auth env (dashboard refuses non-loopback binds without it)
  ansible.builtin.lineinfile:
    path: /home/{{ admin_username }}/.hermes/.env
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    owner: "{{ admin_username }}"
    group: "{{ admin_username }}"
    mode: "0600"
  loop:
    - { key: 'HERMES_DASHBOARD_BASIC_AUTH_USERNAME', value: "{{ dash_user }}" }
    - { key: 'HERMES_DASHBOARD_BASIC_AUTH_PASSWORD', value: "{{ dash_pass }}" }
    - { key: 'HERMES_DASHBOARD_BASIC_AUTH_SECRET', value: "{{ dash_secret }}" }
  no_log: true
  notify: Restart dashboard

- name: Generate dashboard session token when not provided
  ansible.builtin.set_fact:
    dash_token: "{{ lookup('env', 'HERMES_DASHBOARD_SESSION_TOKEN') | default(lookup('password', '/dev/null length=43 chars=ascii_letters,digits'), true) }}"
  no_log: true

- name: Pin the dashboard session token
  ansible.builtin.lineinfile:
    path: /home/{{ admin_username }}/.hermes/.env
    regexp: '^HERMES_DASHBOARD_SESSION_TOKEN='
    line: "HERMES_DASHBOARD_SESSION_TOKEN={{ dash_token }}"
    owner: "{{ admin_username }}"
    group: "{{ admin_username }}"
    mode: "0600"
  no_log: true

- name: Install dashboard service unit (tailnet bind via tailscale serve pattern)
  ansible.builtin.copy:
    dest: /home/{{ admin_username }}/.config/systemd/user/hermes-dashboard.service
    owner: "{{ admin_username }}"
    group: "{{ admin_username }}"
    mode: "0644"
    content: |
      [Unit]
      Description=Hermes dashboard + remote backend (tailnet only)
      After=network-online.target tailscaled.service hermes-gateway.service
      Wants=network-online.target
      [Service]
      ExecStart={{ hermes_bin }} dashboard --host 0.0.0.0 --port {{ hermes_dashboard_port }} --no-open
      Restart=on-failure
      RestartSec=5
      [Install]
      WantedBy=default.target
  notify: Reload user systemd

- name: UFW — dashboard answers on the tailnet only
  community.general.ufw:
    rule: allow
    port: "{{ hermes_dashboard_port }}"
    proto: tcp
    from_ip: 100.64.0.0/10

- name: Enable and start the dashboard
  ansible.builtin.systemd:
    name: hermes-dashboard
    scope: user
    enabled: true
    state: started
    daemon_reload: true
  become_user: "{{ admin_username }}"
  become: true

- name: Wait for the dashboard to answer (authenticated probe)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ hermes_dashboard_port }}/api/status"
    user: "{{ dash_user }}"
    password: "{{ dash_pass }}"
    force_basic_auth: true
    status_code: 200
  register: dash_health
  retries: 12
  delay: 10
  until: dash_health.status == 200
  no_log: true

- name: Dashboard credentials pointer (never the password itself)
  ansible.builtin.debug:
    msg: "Dashboard is password-protected (user `admin`). Sign in from inside Perch; the password lives in ~/.hermes/.env on the server (HERMES_DASHBOARD_BASIC_AUTH_PASSWORD, mode 0600)."

- name: Install the perch-approvals ntfy hook plugin (approval push bridge)
  ansible.builtin.copy:
    dest: /home/{{ admin_username }}/.hermes/plugins/perch-approvals/
    src: perch-approvals/
    owner: "{{ admin_username }}"
    group: "{{ admin_username }}"
    mode: "0644"
  when: lookup('env', 'NTFY_TOPIC') | length > 0

- name: Point the hook at the ntfy topic
  ansible.builtin.lineinfile:
    path: /home/{{ admin_username }}/.hermes/.env
    regexp: '^NTFY_TOPIC='
    line: "NTFY_TOPIC={{ lookup('env', 'NTFY_TOPIC') }}"
    owner: "{{ admin_username }}"
    group: "{{ admin_username }}"
    mode: "0600"
  when: lookup('env', 'NTFY_TOPIC') | length > 0

- name: Pairing instructions
  ansible.builtin.debug:
    msg: >-
      On the server, download-then-run the public pairing script
      (never piped into a shell):
      curl -fsSL https://aryaminus.github.io/perch-site/pair.sh -o pair.sh
      && bash pair.sh --tailscale — then scan the QR with Perch.
      The QR carries API_SERVER_KEY — trusted camera only.
