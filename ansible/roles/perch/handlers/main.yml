# user systemd daemon-reload handler.
- name: Reload user systemd
  ansible.builtin.systemd:
    scope: user
    daemon_reload: true
  become_user: "{{ admin_username }}"
  become: true

- name: Restart dashboard
  ansible.builtin.systemd:
    name: hermes-dashboard
    scope: user
    state: restarted
    daemon_reload: true
  become_user: "{{ admin_username }}"
  become: true

- name: Reload system systemd
  ansible.builtin.systemd:
    daemon_reload: true
