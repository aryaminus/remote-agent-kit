# common — base hardening. Safe to re-run: all tasks are idempotent.
- name: Update apt cache and upgrade
  ansible.builtin.apt:
    update_cache: true
    upgrade: safe
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name:
      - curl
      - git
      - ufw
      - fail2ban
      - tmux
      - unattended-upgrades
      - python3
      - qrencode
      - sqlite3
    state: present

- name: 2 GB swapfile for small boxes
  ansible.builtin.command:
    cmd: fallocate -l 2G /swapfile
    creates: /swapfile

- name: Swapfile permissions
  ansible.builtin.file:
    path: /swapfile
    mode: "0600"
    owner: root
    group: root

- name: Enable swap
  ansible.builtin.command:
    cmd: "{{ item }}"
  loop:
    - mkswap /swapfile
    - swapon /swapfile
  when: "'/swapfile' not in ansible_swaptotal_mb | string"
  changed_when: true
  failed_when: false

- name: Persist swap in fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: /swapfile none swap sw 0 0
    create: true
    mode: "0644"

- name: Key-only SSH, no root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - { regexp: '^#?PasswordAuthentication', line: 'PasswordAuthentication no' }
    - { regexp: '^#?PermitRootLogin', line: 'PermitRootLogin no' }
    - { regexp: '^#?ChallengeResponseAuthentication', line: 'ChallengeResponseAuthentication no' }
  notify: Restart sshd

- name: UFW default deny incoming, allow outgoing
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }

- name: UFW allow SSH (edge rule — tailscale role narrows sshd itself)
  community.general.ufw:
    rule: allow
    name: OpenSSH

- name: Enable UFW
  community.general.ufw:
    state: enabled

- name: Enable unattended security upgrades
  ansible.builtin.systemd:
    name: unattended-upgrades
    enabled: true
    state: started

- name: Stable SSH agent path — every forwarded login refreshes one symlink
  # tmux panes outlive the login that started them, but a forwarded agent's
  # socket (/tmp/ssh-*/agent.N) dies with that login. sshd runs ~/.ssh/rc on
  # every login, so it repoints a fixed path at the newest live socket.
  # rc must print nothing (scp/sftp break); with rc present sshd skips xauth,
  # which this headless box never needs.
  ansible.builtin.blockinfile:
    path: /home/{{ admin_username }}/.ssh/rc
    create: true
    owner: "{{ admin_username }}"
    group: "{{ admin_username }}"
    mode: "0644"
    marker: "# {mark} remote-agent-kit: ssh agent symlink"
    block: |
      if [ -S "$SSH_AUTH_SOCK" ]; then
        ln -sf "$SSH_AUTH_SOCK" "$HOME/.ssh/ssh_auth_sock"
      fi
  tags: ssh_agent

- name: tmux panes use the stable agent path, not the attaching login's socket
  # tmux's default update-environment copies SSH_AUTH_SOCK from whichever
  # client attaches — a path that is dead after that client disconnects.
  # Without forwarding the symlink is absent or stale and ssh uses only the
  # box's own keys, exactly as before.
  ansible.builtin.blockinfile:
    path: /home/{{ admin_username }}/.tmux.conf
    create: true
    owner: "{{ admin_username }}"
    group: "{{ admin_username }}"
    mode: "0644"
    marker: "# {mark} remote-agent-kit: ssh agent"
    block: |
      set -g update-environment "DISPLAY KRB5CCNAME SSH_ASKPASS SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY"
      set-environment -g SSH_AUTH_SOCK /home/{{ admin_username }}/.ssh/ssh_auth_sock
  tags: ssh_agent
