# aoe — Agent of Empires: one tmux session + optional Docker sandbox per
# coding agent (Claude Code, Codex CLI, OpenCode, Pi). Idempotent: skips when
# `aoe` is already on PATH. Verified agent list: `aoe agents` after install.
- name: Install Docker (AoE sandbox backend)
  ansible.builtin.apt:
    name: docker.io
    state: present

- name: hermes user in the docker group
  ansible.builtin.user:
    name: "{{ admin_username }}"
    groups: docker
    append: true

- name: Check whether aoe is installed
  ansible.builtin.command: /usr/local/bin/aoe --version
  register: aoe_check
  changed_when: false
  failed_when: false

- name: Install AoE from the latest GitHub release
  # Asset names verified 2026-09-16: aoe-linux-(amd64|arm64).tar.gz +
  # .sha256 sidecar. ansible shell runs under dash — executable: bash is
  # required (pipefail). Checksum enforced: a corrupt agent runner is worse
  # than none.
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      tag=$(curl -fsSL https://api.github.com/repos/agent-of-empires/agent-of-empires/releases/latest | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')
      arch=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
      tmp=$(mktemp -d)
      base="https://github.com/agent-of-empires/agent-of-empires/releases/download/${tag}/aoe-linux-${arch}"
      file="aoe-linux-${arch}.tar.gz"
      curl -fsSL -o "$tmp/$file" "$base.tar.gz"
      curl -fsSL -o "$tmp/$file.sha256" "$base.tar.gz.sha256"
      ( cd "$tmp" && sha256sum -c "$file.sha256" )
      tar -xzf "$tmp/$file" -C "$tmp"
      install -m 0755 "$tmp/aoe-linux-${arch}" /usr/local/bin/aoe
      rm -rf "$tmp"
    creates: /usr/local/bin/aoe
    executable: /bin/bash
  when: aoe_check.rc != 0

- name: Verify AoE sees the installed CLIs
  ansible.builtin.command: /usr/local/bin/aoe agents
  become_user: "{{ admin_username }}"
  become: true
  register: aoe_agents
  changed_when: false
  failed_when: false

- name: Show detected agents
  ansible.builtin.debug:
    msg: "{{ aoe_agents.stdout_lines | default(['(aoe agents output unavailable — run `aoe agents` over SSH)']) }}"
