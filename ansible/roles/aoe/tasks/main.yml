# aoe — Agent of Empires: one tmux session + optional Docker sandbox per
# coding agent (Claude Code, Codex CLI, OpenCode, Pi). Idempotent: skips when
# `aoe` is already on PATH. Verified agent list: `aoe agents` after install.
- name: Install Docker (AoE sandbox backend)
  ansible.builtin.apt:
    name: docker.io
    state: present

- name: hermes user in the docker group
  ansible.builtin.user:
    name: "{{ admin_username }}"
    groups: docker
    append: true

- name: Check whether aoe is installed
  ansible.builtin.command: /usr/local/bin/aoe --version
  register: aoe_check
  changed_when: false
  failed_when: false

- name: Install AoE from the latest GitHub release
  # Asset names verified 2026-09-16: aoe-linux-(amd64|arm64).tar.gz +
  # .sha256 sidecar. ansible shell runs under dash — executable: bash is
  # required (pipefail). Checksum enforced: a corrupt agent runner is worse
  # than none.
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      tag=$(curl -fsSL https://api.github.com/repos/agent-of-empires/agent-of-empires/releases/latest | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')
      arch=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
      tmp=$(mktemp -d)
      base="https://github.com/agent-of-empires/agent-of-empires/releases/download/${tag}/aoe-linux-${arch}"
      file="aoe-linux-${arch}.tar.gz"
      curl -fsSL -o "$tmp/$file" "$base.tar.gz"
      curl -fsSL -o "$tmp/$file.sha256" "$base.tar.gz.sha256"
      ( cd "$tmp" && sha256sum -c "$file.sha256" )
      tar -xzf "$tmp/$file" -C "$tmp"
      install -m 0755 "$tmp/aoe-linux-${arch}" /usr/local/bin/aoe
      rm -rf "$tmp"
    creates: /usr/local/bin/aoe
    executable: /bin/bash
  when: aoe_check.rc != 0

- name: Install the coding-agent CLIs AoE will drive
  # Exact commands are the ones `aoe agents` itself suggests when a CLI is
  # missing — kept in lockstep. AUTH IS THE USER'S STEP (browser/device flow
  # per vendor); binaries are all that can be automated. Notes learned live:
  #   - become_user has no login PATH: npm must be called by absolute path
  #     (Hermes's node lives in ~/.local/bin, global prefix IS ~/.local)
  #   - curl|bash needs shell+bash (command module split the pipe into args)
  #   - opencode's installer puts the binary in ~/.opencode/bin, not ~/.local
  # Antigravity is intentionally NOT auto-installed: its CLI ships via a
  # Google script whose URL is not stable enough to pin — see docs/usage.md.
  ansible.builtin.shell:
    cmd: "{{ item.cmd }}"
    executable: /bin/bash
  args:
    creates: "{{ item.creates }}"
  become_user: "{{ admin_username }}"
  become: true
  loop:
    - { cmd: 'export PATH="$HOME/.local/bin:$PATH"; npm install -g @anthropic-ai/claude-code', creates: '/home/{{ admin_username }}/.local/bin/claude' }
    - { cmd: 'export PATH="$HOME/.local/bin:$PATH"; npm install -g @openai/codex', creates: '/home/{{ admin_username }}/.local/bin/codex' }
    - { cmd: 'export PATH="$HOME/.local/bin:$PATH"; curl -fsSL https://opencode.ai/install | bash', creates: '/home/{{ admin_username }}/.opencode/bin/opencode' }
  when: install_agent_clis | default(true)

- name: Symlink opencode where AoE's PATH sees it
  # opencode's installer targets ~/.opencode/bin (+bashrc line). AoE detects
  # via standard PATH, so link it into ~/.local/bin — works for login shells
  # AND the aoe TUI alike. Verified live: binary 1.18.31, AoE then detects it.
  ansible.builtin.file:
    src: "/home/{{ admin_username }}/.opencode/bin/opencode"
    dest: "/home/{{ admin_username }}/.local/bin/opencode"
    state: link
  become_user: "{{ admin_username }}"
  become: true
  when: install_agent_clis | default(true)

- name: Verify AoE sees the installed CLIs
  ansible.builtin.command: /usr/local/bin/aoe agents
  become_user: "{{ admin_username }}"
  become: true
  register: aoe_agents
  changed_when: false
  failed_when: false

- name: Show detected agents
  ansible.builtin.debug:
    msg: "{{ aoe_agents.stdout_lines | default(['(aoe agents output unavailable — run `aoe agents` over SSH)']) }}"
