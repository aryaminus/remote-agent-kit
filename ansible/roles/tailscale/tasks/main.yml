# tailscale — zero-trust access. Install → up → verify tailnet SSH works →
# THEN lock sshd to the tailnet IP. Order matters: keep a break-glass session
# open while this runs; Hetzner web console is the last resort.
- name: Fail without an auth key
  ansible.builtin.fail:
    msg: "Set TAILSCALE_AUTHKEY (see .env.example). Get one at https://login.tailscale.com/admin/authkeys"
  when: lookup('env', 'TAILSCALE_AUTHKEY') | length == 0

- name: Install Tailscale (official script, idempotent)
  ansible.builtin.shell:
    cmd: curl -fsSL https://tailscale.com/install.sh | sh
    creates: /usr/bin/tailscale

- name: Enable and start tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Join the tailnet
  # --operator is set here (not only via `tailscale set`) because tailscaled
  # rejects `up` calls that omit any non-default flag once one exists.
  # no_log: the auth key must never land in logs.
  ansible.builtin.command:
    cmd: >-
      tailscale up --authkey={{ lookup('env', 'TAILSCALE_AUTHKEY') }}
      --hostname={{ agent_hostname }} --operator={{ admin_username }} {{ tailscale_extra_args }}
  register: ts_up
  changed_when: "'already' not in (ts_up.stderr | lower)"
  failed_when: ts_up.rc != 0 and 'already' not in (ts_up.stderr | lower)
  no_log: true

- name: Read the tailnet IPv4
  ansible.builtin.command: tailscale ip -4
  register: ts_ip
  changed_when: false

- name: Show the tailnet address
  ansible.builtin.debug:
    msg: "Tailnet IPv4 is {{ ts_ip.stdout }} — MagicDNS: {{ agent_hostname }}.<tailnet>.ts.net"

- name: Verify SSH answers on the tailnet IP before locking down
  ansible.builtin.wait_for:
    host: "{{ ts_ip.stdout }}"
    port: 22
    timeout: 30
  delegate_to: localhost
  become: false

- name: Disable ssh.socket (socket activation ignores ListenAddress)
  # Ubuntu 24.04: an active ssh.socket owns 0.0.0.0:22 and bypasses the
  # ListenAddress lockdown below — disable it or SSH stays publicly bound
  # with zero errors anywhere. Found live on the Path-A test box.
  ansible.builtin.systemd:
    name: ssh.socket
    enabled: false
    state: stopped
  failed_when: false

- name: Bind sshd to tailnet IP + localhost only (or public, per operator choice)
  # lock_ssh_to_tailnet: true  → sshd answers ONLY on the tailnet (default,
  #   most conservative; requires Tailscale on every client).
  # lock_ssh_to_tailnet: false → sshd answers publicly too. Still safe-ish:
  #   key-only auth, no root password, fail2ban, and the Hetzner edge
  #   firewall's SSH rule can pin it to the operator's IP (my_ip in tfvars).
  #   Chosen by operators who don't want a VPN client on their laptop.
  #   The API/dashboard/serve STAY tailnet-only either way.
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?ListenAddress'
    state: "{{ 'present' if lock_ssh_to_tailnet | default(true) else 'absent' }}"
    line: "ListenAddress {{ ts_ip.stdout }}\nListenAddress 127.0.0.1"
  notify: Restart sshd

- name: UFW — SSH allowed from the tailnet range (defense in depth)
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    from_ip: 100.64.0.0/10

- name: Allow tailscaled operator for serve config (one-time, least privilege)
  # Lets the hermes user manage `tailscale serve` without root afterwards.
  ansible.builtin.command: tailscale set --operator={{ admin_username }}
  changed_when: false

- name: Check Tailscale Serve config
  ansible.builtin.command: tailscale serve status
  become_user: "{{ admin_username }}"
  become: true
  register: ts_serve_status
  changed_when: false
  failed_when: false

- name: Expose the API over Tailscale Serve (HTTPS)
  # iOS App Transport Security refuses cleartext HTTP to 100.x (CGNAT is not
  # "local" per ATS), so the phone app REQUIRES https://<host>.<tail>.ts.net.
  # Needs the one-time tailnet admin approval:
  # https://login.tailscale.com/ → DNS → "HTTPS certificates" + Serve enabled.
  # Without it this task fails loudly with the approval URL — enable and re-run.
  ansible.builtin.command: tailscale serve --bg --https=443 http://127.0.0.1:{{ hermes_api_port }}
  become_user: "{{ admin_username }}"
  become: true
  register: ts_serve
  changed_when: "'Available within your tailnet' in ts_serve.stdout"
  failed_when: ts_serve.rc != 0
  when: "'https://' not in ts_serve_status.stdout"

- name: UFW — HTTPS serve answers on the tailnet only
  community.general.ufw:
    rule: allow
    port: "443"
    proto: tcp
    from_ip: 100.64.0.0/10

- name: Flush handlers so sshd restarts before we continue
  ansible.builtin.meta: flush_handlers
