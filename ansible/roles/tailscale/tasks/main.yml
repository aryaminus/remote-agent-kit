# tailscale — zero-trust access. Install → up → verify tailnet SSH works →
# THEN lock sshd to the tailnet IP. Order matters: keep a break-glass session
# open while this runs; Hetzner web console is the last resort.
- name: Fail without an auth key
  ansible.builtin.fail:
    msg: "Set TAILSCALE_AUTHKEY (see .env.example). Get one at https://login.tailscale.com/admin/authkeys"
  when: lookup('env', 'TAILSCALE_AUTHKEY') | length == 0

- name: Install Tailscale (official script, idempotent)
  ansible.builtin.shell:
    cmd: curl -fsSL https://tailscale.com/install.sh | sh
    creates: /usr/bin/tailscale

- name: Enable and start tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Join the tailnet
  ansible.builtin.command:
    cmd: >-
      tailscale up --authkey={{ lookup('env', 'TAILSCALE_AUTHKEY') }}
      --hostname={{ tailscale_hostname }} {{ tailscale_extra_args }}
  register: ts_up
  changed_when: "'already' not in (ts_up.stderr | lower)"
  failed_when: ts_up.rc != 0 and 'already' not in (ts_up.stderr | lower)

- name: Read the tailnet IPv4
  ansible.builtin.command: tailscale ip -4
  register: ts_ip
  changed_when: false

- name: Show the tailnet address
  ansible.builtin.debug:
    msg: "Tailnet IPv4 is {{ ts_ip.stdout }} — MagicDNS: {{ tailscale_hostname }}.<tailnet>.ts.net"

- name: Verify SSH answers on the tailnet IP before locking down
  ansible.builtin.wait_for:
    host: "{{ ts_ip.stdout }}"
    port: 22
    timeout: 30
  delegate_to: localhost
  become: false

- name: Bind sshd to tailnet IP + localhost only
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?ListenAddress'
    line: "ListenAddress {{ ts_ip.stdout }}\nListenAddress 127.0.0.1"
  notify: Restart sshd

- name: UFW — SSH allowed from the tailnet range (defense in depth)
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    from_ip: 100.64.0.0/10

- name: Flush handlers so sshd restarts before we continue
  ansible.builtin.meta: flush_handlers
