# telegram — OPTIONAL polling bot. The bot dials OUT, so no inbound firewall
# ports are needed. Without TELEGRAM_BOT_TOKEN + TELEGRAM_ALLOWED_USERS the
# whole bot half is skipped (the phone app is enough for many); the gateway
# service below still installs and starts so the API works regardless.
# The allow-list is mandatory WHEN the bot is on: a token without it is public.
- name: Note Telegram skipped (optional, re-run --tags telegram anytime)
  ansible.builtin.debug:
    msg: "TELEGRAM_BOT_TOKEN/TELEGRAM_ALLOWED_USERS unset — bot skipped. Docs: docs/telegram-setup.md."
  when: lookup('env', 'TELEGRAM_BOT_TOKEN') | length == 0 or lookup('env', 'TELEGRAM_ALLOWED_USERS') | length == 0

- name: Write Telegram env
  ansible.builtin.lineinfile:
    path: /home/{{ admin_username }}/.hermes/.env
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    owner: "{{ admin_username }}"
    group: "{{ admin_username }}"
    mode: "0600"
  loop:
    - { key: 'TELEGRAM_BOT_TOKEN', value: "{{ lookup('env', 'TELEGRAM_BOT_TOKEN') }}" }
    - { key: 'TELEGRAM_ALLOWED_USERS', value: "{{ lookup('env', 'TELEGRAM_ALLOWED_USERS') }}" }
  no_log: true
  when: lookup('env', 'TELEGRAM_BOT_TOKEN') | length > 0 and lookup('env', 'TELEGRAM_ALLOWED_USERS') | length > 0
  notify: Restart gateway

- name: Configure the gateway platform (writes config, starts nothing)
  ansible.builtin.command: "{{ hermes_bin }} gateway setup --platform {{ telegram_platform }}"
  become_user: "{{ admin_username }}"
  become: true
  register: gw_setup
  changed_when: "'already' not in (gw_setup.stdout | lower)"
  failed_when: false
  when: lookup('env', 'TELEGRAM_BOT_TOKEN') | length > 0 and lookup('env', 'TELEGRAM_ALLOWED_USERS') | length > 0
  # NOTE: telegram_platform defaults to telegram. Other platforms
  # (discord/whatsapp/signal) need their own token env vars — see group_vars.

- name: Install the gateway as a user systemd service (non-interactive workaround)
  # Upstream asks two [Y/n] prompts with no --yes flag; over SSH stdin it
  # aborts and installs nothing. n = don't start now, Y = enable on boot.
  ansible.builtin.shell:
    cmd: printf 'n\nY\n' | {{ hermes_bin }} gateway install
    creates: /home/{{ admin_username }}/.config/systemd/user/hermes-gateway.service
  become_user: "{{ admin_username }}"
  become: true

- name: Enable lingering so the gateway survives reboot without login
  ansible.builtin.command: loginctl enable-linger {{ admin_username }}
  changed_when: false

- name: Start the gateway
  ansible.builtin.systemd:
    name: hermes-gateway
    scope: user
    enabled: true
    state: started
  become_user: "{{ admin_username }}"
  become: true

- name: Flush handlers now (a rotated bot token must be live before we declare health)
  ansible.builtin.meta: flush_handlers

- name: Wait for the gateway API to answer locally
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ hermes_api_port }}/health"
    status_code: 200
  register: health
  retries: 12
  delay: 10
  until: health.status == 200
