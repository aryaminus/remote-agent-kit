# ── remote-agent-kit defaults. Override per host in hosts.yml, never commit secrets.
# Secrets arrive as env vars at runtime (see .env.example):
#   TAILSCALE_AUTHKEY, TELEGRAM_BOT_TOKEN, TELEGRAM_ALLOWED_USERS,
#   OPENROUTER_API_KEY / ANTHROPIC_API_KEY, API_SERVER_KEY, NTFY_TOPIC.

# Which roles run (toggle features here):
enable_tailscale: true
enable_hermes: true
# Telegram is OFF unless credentials exist: the role skips cleanly without
# TELEGRAM_BOT_TOKEN + TELEGRAM_ALLOWED_USERS (gateway still starts for API).
enable_telegram: true
enable_perch_api: true
enable_aoe: true
# Herdr is the terminal-first alternative to AoE (no sandboxing/web UI —
# see docs/alternatives.md). Install-only; default off.
enable_herdr: false
enable_backups: true
# Coding-agent CLIs (claude/codex/opencode/cmd) + their model keys.
# Binaries only — auth stays yours (browser/device flow per vendor).
install_agent_clis: true

# ── Box identity (NOT brand-tied). Rename freely — nothing here depends on
# hermes/perch/agent-kit in the name. Tailscale hostname becomes
# <agent_hostname>.<tailnet>.ts.net; the OS user and all paths follow
# admin_username. Defaults keep a recognizable, product-neutral box name.
agent_hostname: agentbox
admin_username: agentbox

# Hermes versions — pin for reproducibility, bump deliberately.
hermes_installer_url: https://hermes-agent.nousresearch.com/install.sh
# The installer puts the CLI in ~/.local/bin (toolchain stays in ~/.hermes).
# Verified against a live install — never assume ~/.hermes/bin.
hermes_bin: /home/{{ admin_username }}/.local/bin/hermes
hermes_api_port: 8642
hermes_dashboard_port: 9119
# Model wiring on the server. `nous` = OAuth via `hermes setup --portal`
# (no key stored). openrouter/anthropic need their key in .env.
model_provider: nous

# ControlKeel release pinned for the box install (bump deliberately after
# verifying the new version's attach surfaces — see docs/usage.md).
controlkeel_version: 0.4.16

# Verified 2026-09-16 (githubcli-archive-keyring.gpg, upstream rotation possible —
# re-fetch + update if the get_url checksum task ever fails).
gh_keyring_sha256: 6084d5d7bd8e288441e0e94fc6275570895da18e6751f70f057485dc2d1a811b

# Phone app as PWA (perch role): path to a local tarball of the exported
# Perch web build. Empty = skip (native app or nothing). Build it with:
#   cd apps/mobile && pnpm export:web && tar --exclude='*.map' -czf /tmp/perch-web.tgz dist
perch_web_tarball: ""
perch_web_port: 8091
perch_web_serve_port: 8443

# Messaging platform. telegram is the tested default; Hermes also speaks
# discord, whatsapp and signal through the same gateway setup flow — set this
# var and matching *_BOT_TOKEN / *_ALLOWED_USERS env to switch (see the
# gateway docs for per-platform variable names before relying on it).
telegram_platform: telegram

# Tailscale (hostname comes from agent_hostname above)
tailscale_extra_args: ""   # e.g. "--advertise-tags=tag:server"

# Backups
backup_dir: /home/{{ admin_username }}/backups
backup_retention_days: 14
# age public key for encrypted backups. Empty = plain tarballs (still off-box via rsync).
age_public_key: ""
