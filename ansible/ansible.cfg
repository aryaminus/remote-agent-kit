[defaults]
inventory = inventory/hosts.yml
collections_path = ./collections
roles_path = ./roles
host_key_checking = True
retry_files_enabled = False
# community.general 12 removed its `yaml` callback; core's default renders YAML.
stdout_callback = default
callback_result_format = yaml
# become_user staging: temp files are chmodded to the BECOME TARGET user,
# NOT the login user. The target comes from group_vars admin_username
# (agentbox for fresh clones). World-readable staging is the documented
# default that breaks on ACL-less filesystems, so pin it off.
